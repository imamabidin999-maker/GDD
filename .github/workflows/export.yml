# Membuat versi siap main (Windows, Linux, Web) dengan Godot 4.7.2.
# Jalan otomatis saat ada push ke main/master, atau manual lewat tab
# Actions -> "Export game" -> Run workflow. Hasilnya bisa diunduh dari
# bagian Artifacts di halaman run tersebut.
name: Export game

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export:
    name: Export ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "Windows Desktop"
            path: build/windows/Dongkrek.exe
            artifact: dongkrek-windows
          - preset: "Linux"
            path: build/linux/Dongkrek.x86_64
            artifact: dongkrek-linux
          - preset: "Web"
            path: build/web/index.html
            artifact: dongkrek-web
    steps:
      - uses: actions/checkout@v4
      - name: Pasang Godot dan export template
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          rm -rf templates *.zip *.tpz
      - name: Export
        run: |
          mkdir -p "$(dirname "${{ matrix.path }}")"
          godot --headless --import || true
          godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/
